<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sota Kece</title>
<style>
  html,body{margin:0;height:100%;background:#FCF3E2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

</head>
<body class="light">
<main>
  <h1>Sota Kece</h1>
  <p>You're offline. Connect to the internet and try again.</p>
  <button type="button" onclick="location.replace('https://sotakece.com/')">Try again</button>
</main>
<script>window.addEventListener('online',function(){location.replace('https://sotakece.com/')});</script>
